<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>최수정 | TA코치 디지털 명함</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Main Color (1): KB Rich Yellow-Gold */
      --main: #c78b00;
      --main-dark: #9a6800;
      --main-light: #e5a500;
      --main-soft: rgba(199, 139, 0, 0.1);

      /* Accent Color (1): KB Star Yellow */
      --accent: #d99100;
      --accent-soft: rgba(255, 188, 0, 0.18);

      /* White & Gray Scale */
      --white: #ffffff;
      --bg-top: #f8f9fb;
      --bg-bottom: #eef1f5;
      --card-bg: #f6f7f9;
      --gray-900: #161a22;
      --gray-700: #3d4452;
      --gray-500: #6e7687;
      --gray-400: #9aa1b0;
      --gray-200: #e5e8ee;
      --gray-100: #f1f3f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--gray-900);
      background: #e6e9ef;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Desktop centering backdrop */
    .stage {
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #eaedf3 0%, #dde2eb 100%);
    }

    /* 9:16 Mobile Viewport / Phone Frame */
    .phone-frame {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 481px) {
      .phone-frame {
        aspect-ratio: 9 / 16;
        width: min(430px, 92vw);
        height: min(calc(100dvh - 36px), 860px);
        border-radius: 38px;
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow:
          0 32px 72px -12px rgba(14, 24, 41, 0.28),
          0 12px 28px -8px rgba(14, 24, 41, 0.14),
          inset 0 0 0 1px rgba(22, 36, 59, 0.06);
      }
    }

    /* Subtle ambient radial lights (Top-Right & Bottom-Left) */
    .bg-glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow--tr {
      width: 280px;
      height: 280px;
      top: -90px;
      right: -85px;
      background: radial-gradient(circle, rgba(255, 188, 0, 0.22) 0%, rgba(255, 188, 0, 0) 70%);
    }

    .bg-glow--bl {
      width: 300px;
      height: 300px;
      bottom: -100px;
      left: -100px;
      background: radial-gradient(circle, rgba(199, 139, 0, 0.12) 0%, rgba(199, 139, 0, 0) 70%);
    }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 24px 20px;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.96) 0%,
        rgba(255, 255, 255, 0.82) 64%,
        rgba(255, 255, 255, 0) 100%
      );
      flex-shrink: 0;
    }

    .back-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--gray-200);
      background: var(--white);
      box-shadow: 0 4px 12px rgba(22, 36, 59, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--gray-900);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease;
    }

    .back-btn:active {
      transform: scale(0.92);
      box-shadow: 0 2px 6px rgba(22, 36, 59, 0.06);
    }

    .top-title {
      text-align: right;
      line-height: 1.25;
    }

    .top-title__main {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: -0.02em;
    }

    .top-title__sub {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      color: var(--accent);
      margin-right: -0.32em;
    }

    /* Scrollable Card Area (scrollbar hidden) */
    .card-scroll {
      position: relative;
      z-index: 10;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 20px calc(86px + env(safe-area-inset-bottom, 0px));
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .card-scroll::-webkit-scrollbar {
      display: none;
    }

    /* Business Card */
    .card {
      position: relative;
      width: 100%;
      max-width: 372px;
      margin: 0 auto;
      border-radius: 30px;
      background: var(--card-bg);
      box-shadow:
        0 26px 56px -12px rgba(22, 36, 59, 0.18),
        0 10px 24px -8px rgba(22, 36, 59, 0.08);
      overflow: hidden;
      padding-bottom: 11px;
      transform: translateY(72px);
      opacity: 0;
      animation: cardEnter 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEnter {
      0% {
        transform: translateY(72px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* White sheen sweep animation across card */
    .card::after {
      content: "";
      position: absolute;
      top: -20%;
      left: -85%;
      width: 55%;
      height: 140%;
      background: linear-gradient(
        105deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.06) 35%,
        rgba(255, 255, 255, 0.42) 50%,
        rgba(255, 255, 255, 0.06) 65%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-18deg);
      pointer-events: none;
      z-index: 30;
      animation: cardSheen 2.1s cubic-bezier(0.22, 1, 0.36, 1) 0.7s 1 forwards;
    }

    @keyframes cardSheen {
      0% {
        left: -85%;
      }
      100% {
        left: 145%;
      }
    }

    /* 1) Header Band */
    .card-band {
      position: relative;
      height: 168px;
      padding: 26px 24px 0;
      background: linear-gradient(135deg, var(--main-dark) 0%, var(--main) 54%, var(--main-light) 100%);
      overflow: hidden;
    }

    /* 2 subtle circular lights at corners */
    .card-band::before,
    .card-band::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .card-band::before {
      width: 156px;
      height: 156px;
      top: -54px;
      right: -36px;
      background: radial-gradient(circle, rgba(255, 214, 70, 0.38) 0%, rgba(255, 214, 70, 0) 70%);
    }

    .card-band::after {
      width: 140px;
      height: 140px;
      bottom: -62px;
      left: -34px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 70%);
    }

    .band-title {
      position: relative;
      z-index: 2;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--white);
      line-height: 1.1;
    }

    .band-subtitle {
      position: relative;
      z-index: 2;
      margin-top: 7px;
      font-size: 9.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.44em;
      color: rgba(255, 255, 255, 0.72);
    }

    /* 2) White Sheet */
    .card-sheet {
      position: relative;
      z-index: 5;
      margin: -38px 11px 0;
      padding: 62px 20px 22px;
      border-radius: 25px;
      background: var(--white);
      box-shadow: 0 12px 30px rgba(22, 36, 59, 0.08);
    }

    /* 3) Profile Photo */
    .avatar-wrap {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid var(--white);
      background: var(--gray-100);
      box-shadow: 0 10px 24px rgba(22, 36, 59, 0.18);
      overflow: hidden;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }

    /* 4) Name & Bio */
    .profile-header {
      text-align: center;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 900;
      color: var(--gray-900);
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .profile-bio {
      margin-top: 8px;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--gray-500);
      word-break: keep-all;
    }

    .profile-role {
      font-weight: 700;
      color: var(--accent);
    }

    /* 5) 4 Action Buttons */
    .actions-grid {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      justify-items: center;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      color: inherit;
      font-family: inherit;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .action-item:active {
      transform: scale(0.93);
    }

    .action-box {
      width: 51px;
      height: 51px;
      border-radius: 15px;
      background: var(--gray-100);
      border: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--main);
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .action-item:hover .action-box {
      background: var(--main-soft);
      border-color: rgba(199, 139, 0, 0.22);
    }

    .action-item--save .action-box {
      background: var(--accent-soft);
      border-color: rgba(255, 188, 0, 0.42);
      color: var(--accent);
    }

    .action-label {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--gray-700);
    }

    /* 6) Divider 1px */
    .divider {
      height: 1px;
      background: var(--gray-200);
      margin: 22px 0 4px;
    }

    /* 7) Info List */
    .info-list {
      list-style: none;
    }

    .info-item {
      border-bottom: 1px solid var(--gray-200);
    }

    .info-item:last-child {
      border-bottom: none;
    }

    .info-link,
    .info-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 2px;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.15s ease;
    }

    .info-link:active {
      opacity: 0.65;
    }

    .info-content {
      min-width: 0;
      flex: 1;
    }

    .info-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--gray-400);
      margin-bottom: 4px;
    }

    .info-value {
      display: block;
      font-size: 15px;
      font-weight: 500;
      color: var(--gray-900);
      line-height: 1.5;
      word-break: keep-all;
    }

    .info-value--multiline .info-line-first {
      display: block;
      font-weight: 700;
      color: var(--gray-900);
    }

    .info-value--multiline .info-line-sub {
      display: block;
      margin-top: 2px;
      font-size: 13.5px;
      font-weight: 400;
      color: var(--gray-700);
    }

    .info-chevron {
      flex-shrink: 0;
      color: var(--gray-400);
    }

    /* Floating Share Button */
    .share-fab {
      position: absolute;
      right: 22px;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      z-index: 25;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--main) 0%, var(--main-light) 100%);
      color: var(--white);
      box-shadow:
        0 12px 26px rgba(154, 104, 0, 0.34),
        0 4px 10px rgba(154, 104, 0, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: translateY(28px) scale(0.9);
      animation: fabEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease;
    }

    @keyframes fabEnter {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .share-fab:active {
      transform: scale(0.92);
      box-shadow: 0 6px 14px rgba(22, 36, 59, 0.28);
    }

    /* Toast */
    .toast {
      position: absolute;
      left: 50%;
      bottom: calc(86px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(14px);
      z-index: 40;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(34, 34, 36, 0.92);
      color: var(--white);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      box-shadow: 0 10px 24px rgba(14, 24, 41, 0.24);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

    (function () {
      const toastEl = document.getElementById('toast');
      const backBtn = document.getElementById('backBtn');
      const saveVcfBtn = document.getElementById('saveVcfBtn');
      const shareBtn = document.getElementById('shareBtn');
      const cardScroll = document.getElementById('cardScroll');
      let toastTimer = null;

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('is-visible');
        if (toastTimer) {
          clearTimeout(toastTimer);
        }
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('is-visible');
        }, 2400);
      }

      function copyFallback(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        let copied = false;
        try {
          copied = document.execCommand('copy');
        } catch (err) {
          copied = false;
        }
        document.body.removeChild(textarea);
        return copied;
      }

      backBtn.addEventListener('click', function () {
        if (cardScroll.scrollTop > 10) {
          cardScroll.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        if (window.history.length > 1) {
          window.history.back();
        } else {
          showToast('현재 명함 화면입니다');
        }
      });

      saveVcfBtn.addEventListener('click', function () {
        const vcardLines = [
          'BEGIN:VCARD',
          'VERSION:3.0',
          'N:최;수정;;;',
          'FN:최수정',
          'ORG:KB손해보험',
          'TITLE:TA코치',
          'TEL;TYPE=CELL,VOICE:010-5284-4167',
          'EMAIL;TYPE=WORK,INTERNET:csj24@kbinsure.co.kr',
          'NOTE:신입 설계사의 성장을 돕고, 상담 역량과 영업 자신감을 키워주는 전문 교육 코치',
          'END:VCARD'
        ];
        const blob = new Blob(['\uFEFF' + vcardLines.join('\r\n')], {
          type: 'text/vcard;charset=utf-8'
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = '최수정_TA코치.vcf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
        showToast('연락처가 저장되었습니다');
      });

      shareBtn.addEventListener('click', async function () {
        const shareData = {
          title: '최수정 | TA코치 디지털 명함',
          text: '최수정 TA코치 · 신입 설계사의 성장을 돕는 전문 교육 코치',
          url: window.location.href
        };

        if (navigator.share) {
          try {
            await navigator.share(shareData);
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') {
              return;
            }
          }
        }

        const currentUrl = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(currentUrl);
            showToast('명함 주소가 복사되었습니다');
            return;
          } catch (err) {
            // Fall through to execCommand fallback
          }
        }

        if (copyFallback(currentUrl)) {
          showToast('명함 주소가 복사되었습니다');
        } else {
          showToast('주소를 복사할 수 없습니다');
        }
      });
    })();
  </script>
</body>
</html>
